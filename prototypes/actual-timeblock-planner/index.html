<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeFlow · 실제 일정 기록 시제품</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><div><p>LifeFlow prototype</p><h1>계획과 실제 기록</h1></div><span data-status>오른쪽 실제 시간표의 빈 칸을 드래그해 기록하세요.</span></header>
<section class="comparison"><article><div class="heading"><div><p>읽기 전용</p><h2>계획 일정</h2></div><small>계획은 참고용입니다</small></div><div class="grid-scroll"><div class="grid" data-plan-grid></div></div></article><article><div class="heading"><div><p>직접 기록</p><h2>실제 일정</h2></div><output data-total>0개 · 0분</output></div><div class="grid-scroll"><div class="grid" data-actual-grid></div></div></article></section>
</main>
<dialog data-editor><form method="dialog"><header><div><p data-editor-kind>실제 일정 등록</p><h2 data-editor-heading>선택한 시간</h2></div><button value="cancel" formnovalidate aria-label="닫기">×</button></header><p class="range" data-editor-range></p><label>실제 일정명<input required maxlength="80" data-title placeholder="예: 개발 공부"></label><label class="check"><input type="checkbox" data-link-toggle> 계획 일정과 연결</label><fieldset data-plan-picker hidden><legend>연결할 계획 일정</legend><div data-plan-options></div></fieldset><footer><button value="cancel" formnovalidate>취소</button><button class="danger" value="delete" formnovalidate data-delete hidden>삭제</button><button class="primary" value="save" data-save>저장</button></footer></form></dialog>
<script src="app.js"></script></body></html>
